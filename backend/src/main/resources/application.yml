spring:
  # Load the backend/.env values.
  config:
    import: optional:file:.env[.properties]

  application:
    # Apllication name.
    name: techstore

  # Database credentials.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Closes the Hibernate session at the end of the service call instead of holding it open until
    # the HTTP response is written. This is used for performance.
    open-in-view: false

    # Everything releated to the database will be handled by fly way
    # using migration, so like that hibernate will not change anything in the database.
    hibernate:
      ddl-auto: validate
    
    # Disable showing any sql runned code in the terminal.
    show-sql: false

    properties:
      hibernate:
        format-sql: true

  flyway:
    enabled: true

    # Where the versioned V*.sql files live.
    locations: classpath:db/migration

    # Only relevant when adopting Flyway into a database that already has tables: it writes a
    # baseline row instead of refusing to start.
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  cors:
    allowed-origins:
      - http://localhost:5173

server:
  # 8000 is a fallback if SERVER_PORT is not set in .env.
  port: ${SERVER_PORT:8000}