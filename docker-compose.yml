services:
  postgres:
    image: postgres:16-alpine

    # Load environment variables from this file
    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Build this image from the Dockerfile found in ./backend
    build:
      context: ./backend

    # Take postgreSQl credentials from .env file
    env_file:
      - ./backend/.env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tech_store_spring_db
    ports:
      - "8080:8080"

    # Don't start the backend until postgres passes its healthcheck.
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: